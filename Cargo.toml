[workspace]
resolver = "3"
members = ["rust/emumee-core", "rust/emumee-engine", "rust/emumee-platform", "rust/emumee-cli", "rust/emumee-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
unicorn-engine = { version = "=2.1.5", default-features = false, features = ["arch_x86", "dynamic_linkage"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_SystemServices"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Fast optimized source checks; packaged workers continue to use release.
[profile.validation]
inherits = "release"
opt-level = 1
lto = "off"
codegen-units = 8
incremental = true
debug-assertions = true
overflow-checks = true
